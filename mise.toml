# Tools for the Xcode project, the release scripts, workflow linting, and Node
# for commitlint (package.json). Rust itself comes from rustup via
# rust-toolchain.toml, and Swift from Xcode.
[tools]
xcodegen = "2.46.0"
git-cliff = "2.14.2"
shellcheck = "0.11.0"
actionlint = "1.7.12"
node = "24.22.0"
