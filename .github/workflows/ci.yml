name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Pushes to main aren't cancelled: the run that saves the Rust cache must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Line numbers only, not full debug info: much smaller caches.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  DERIVED_DATA: build/DerivedData
  # The XCUITest target. `test` skips it and `e2e` runs only it; both first
  # check the test build contains it, so a renamed target fails instead of
  # `test` running the E2E suite or `e2e` passing with no tests.
  E2E_TARGET: LiveSplitOneE2ETests

jobs:
  # Builds core/ and the app with its tests once, saves the Rust cache, and
  # hands the test build to `test` and `e2e`. On push to main it only builds,
  # to save the cache new pull requests restore: GitHub lets a pull request
  # read its base branch's caches, not other pull requests' (spec §15).
  setup:
    name: setup
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          save-cache: 'true'
      - run: cargo clippy --all-targets --locked --manifest-path core/Cargo.toml
      - run: cargo test --no-run --locked --manifest-path core/Cargo.toml
      - run: xcodegen generate
      - name: Build the app and its tests
        run: >-
          xcodebuild build-for-testing -project LiveSplitOne.xcodeproj
          -scheme LiveSplitOne -destination 'platform=macOS'
          -derivedDataPath "$DERIVED_DATA"
      # upload-artifact drops file permissions, so the build travels as a tar.
      - name: Pack the test build
        if: github.event_name == 'pull_request'
        run: tar -C "$DERIVED_DATA" -cf test-build.tar Build/Products
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: test-build
          path: test-build.tar
          retention-days: 1
          if-no-files-found: error

  # These jobs use `!cancelled()` so they still run when `setup` fails: a job
  # skipped because `setup` failed reports as success and would not block the
  # merge, so they run anyway and report the real failure.
  lint:
    name: lint
    needs: setup
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo fmt --check --manifest-path core/Cargo.toml
      - run: cargo clippy --all-targets --locked --manifest-path core/Cargo.toml -- -D warnings
      - run: swift format lint --strict --recursive App Tests LiveSplitCore/Wrapper scripts
      # actionlint also runs shellcheck on the workflows' `run:` blocks.
      - run: actionlint
      - run: shellcheck scripts/*.sh

  test:
    name: test
    needs: setup
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo test --locked --manifest-path core/Cargo.toml
      - uses: actions/download-artifact@v8
        with:
          name: test-build
      - run: mkdir -p "$DERIVED_DATA" && tar -C "$DERIVED_DATA" -xf test-build.tar
      - name: Check the test build has the E2E target
        run: |
          shopt -s nullglob
          runs=("$DERIVED_DATA"/Build/Products/*.xctestrun)
          if (( ${#runs[@]} != 1 )); then
            echo "::error::Expected one .xctestrun, found ${#runs[@]}"
            exit 1
          fi
          # Targets appear as <key>BlueprintName</key><string>NAME</string>,
          # the name -only-testing and -skip-testing match.
          if ! grep -A1 '<key>BlueprintName</key>' "${runs[0]}" |
            grep -q "<string>$E2E_TARGET</string>"; then
            echo "::error::${runs[0]} has no test target named $E2E_TARGET"
            exit 1
          fi
          echo "XCTESTRUN=${runs[0]}" >> "$GITHUB_ENV"
      - name: Unit, headless UI and integration tests
        run: >-
          xcodebuild test-without-building -xctestrun "$XCTESTRUN"
          -destination 'platform=macOS' -skip-testing:"$E2E_TARGET"

  e2e:
    name: e2e
    needs: setup
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: macos-latest
    steps:
      # Only the local actions are needed, to select the pinned Xcode.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/select-xcode
      - uses: actions/download-artifact@v8
        with:
          name: test-build
      - run: mkdir -p "$DERIVED_DATA" && tar -C "$DERIVED_DATA" -xf test-build.tar
      - name: Check the test build has the E2E target
        run: |
          shopt -s nullglob
          runs=("$DERIVED_DATA"/Build/Products/*.xctestrun)
          if (( ${#runs[@]} != 1 )); then
            echo "::error::Expected one .xctestrun, found ${#runs[@]}"
            exit 1
          fi
          # Targets appear as <key>BlueprintName</key><string>NAME</string>,
          # the name -only-testing and -skip-testing match.
          if ! grep -A1 '<key>BlueprintName</key>' "${runs[0]}" |
            grep -q "<string>$E2E_TARGET</string>"; then
            echo "::error::${runs[0]} has no test target named $E2E_TARGET"
            exit 1
          fi
          echo "XCTESTRUN=${runs[0]}" >> "$GITHUB_ENV"
      - name: E2E tests
        run: >-
          xcodebuild test-without-building -xctestrun "$XCTESTRUN"
          -destination 'platform=macOS' -only-testing:"$E2E_TARGET"

  build:
    name: build
    needs: setup
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Release universal builds have their own cache, which only main saves
      # (the release workflow), so this job restores it but never saves.
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - run: scripts/build-app.sh 0.0.0-dev
      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: dist/*.zip
          if-no-files-found: error

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: wagoid/commitlint-github-action@v6
