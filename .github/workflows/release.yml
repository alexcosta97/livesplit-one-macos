name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# A newer merge cancels an older run, including a release candidate still
# waiting for approval, so only the latest candidate can be promoted.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      rc_version: ${{ steps.next.outputs.rc_version }}
      rc_tag: ${{ steps.next.outputs.rc_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only git-cliff: XcodeGen in mise.toml is macOS-only.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: git-cliff
      - id: next
        run: scripts/release/next-version.sh
      # Both notes are written here, in a job with a read-only token, so the
      # jobs that publish (contents: write) run no third-party action. The
      # notes depend only on the history up to this commit and the full
      # release tags, and the concurrency group stops another run publishing
      # one in between, so they are the same as when the release is published.
      - name: Write the release notes
        if: steps.next.outputs.release == 'true'
        env:
          PREVIOUS_RC_TAG: ${{ steps.next.outputs.previous_rc_tag }}
        run: |
          mkdir notes
          scripts/release/notes.sh rc "$PREVIOUS_RC_TAG" > notes/rc.md
          scripts/release/notes.sh full > notes/full.md
      - if: steps.next.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes/
          if-no-files-found: error

  build-candidate:
    name: build candidate
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.rc_version }}
      ref: ${{ github.sha }}
      artifact-name: candidate

  candidate:
    name: publish release candidate
    needs: [version, build-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # No checkout and no third-party action while this job holds a write
    # token: the notes come from the version job, and gh is preinstalled.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RC_TAG: ${{ needs.version.outputs.rc_tag }}
        run: |
          # gh creates a release with assets as a draft without a tag and only
          # publishes it after the upload. A job killed mid-upload leaves that
          # draft, pointing at an old commit, so delete a draft and start over.
          # "release not found" means missing; any other failure fails the step.
          err=$(mktemp)
          if draft=$(gh release view "$RC_TAG" --json isDraft --jq .isDraft 2> "$err"); then
            [[ "$draft" == true || "$draft" == false ]] || { echo "unexpected isDraft: $draft" >&2; cat "$err" >&2; exit 1; }
          else
            grep -q "release not found" "$err" || { cat "$err" >&2; exit 1; }
            draft=none
          fi
          if [[ "$draft" == true ]]; then
            gh release delete "$RC_TAG" --yes
            draft=none
          fi
          if [[ "$draft" == none ]]; then
            gh release create "$RC_TAG" dist/* --prerelease --target "$GITHUB_SHA" \
              --title "$RC_TAG" --notes-file notes/rc.md
          else
            gh release upload "$RC_TAG" dist/* --clobber
          fi

  approve:
    name: approve release
    needs: [version, candidate]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - env:
          RC_TAG: ${{ needs.version.outputs.rc_tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: echo "Promoting $RC_TAG to v$VERSION"

  build-final:
    name: build release
    needs: [version, approve]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}
      artifact-name: final

  release:
    name: publish release
    needs: [version, build-final]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # As in the candidate job: no checkout and no third-party action.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: final
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          # See the candidate step: a killed publish leaves a tagless draft,
          # which must not be published as it is, since that would tag an old
          # commit. A draft has no tag, so deleting it needs no --cleanup-tag.
          # "release not found" means missing; any other failure fails the step.
          err=$(mktemp)
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> "$err"); then
            [[ "$draft" == true || "$draft" == false ]] || { echo "unexpected isDraft: $draft" >&2; cat "$err" >&2; exit 1; }
          else
            grep -q "release not found" "$err" || { cat "$err" >&2; exit 1; }
            draft=none
          fi
          if [[ "$draft" == true ]]; then
            gh release delete "$TAG" --yes
            draft=none
          fi
          if [[ "$draft" == none ]]; then
            gh release create "$TAG" dist/* --latest --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file notes/full.md
          else
            # A re-run after a failure after the release was published.
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --prerelease=false --latest --notes-file notes/full.md
          fi
