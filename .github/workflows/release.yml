name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# A newer merge cancels an older run, including a release candidate still
# waiting for approval, so only the latest candidate can be promoted.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      rc_version: ${{ steps.next.outputs.rc_version }}
      rc_tag: ${{ steps.next.outputs.rc_tag }}
      previous_rc_tag: ${{ steps.next.outputs.previous_rc_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Only git-cliff: XcodeGen in mise.toml is macOS-only.
      - uses: jdx/mise-action@v4
        with:
          install_args: git-cliff
      - id: next
        run: scripts/release/next-version.sh

  build-candidate:
    name: build candidate
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.rc_version }}
      ref: ${{ github.sha }}
      artifact-name: candidate

  candidate:
    name: publish release candidate
    needs: [version, build-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Only git-cliff: XcodeGen in mise.toml is macOS-only.
      - uses: jdx/mise-action@v4
        with:
          install_args: git-cliff
      - uses: actions/download-artifact@v8
        with:
          name: candidate
          path: dist
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ needs.version.outputs.rc_tag }}
          PREVIOUS_RC_TAG: ${{ needs.version.outputs.previous_rc_tag }}
        run: |
          scripts/release/notes.sh rc "$PREVIOUS_RC_TAG" > notes.md
          # gh creates a release with assets as a draft without a tag and only
          # publishes it after the upload. A job killed mid-upload leaves that
          # draft, pointing at an old commit, so delete a draft and start over.
          # "release not found" means missing; any other failure fails the step.
          if ! draft=$(gh release view "$RC_TAG" --json isDraft --jq .isDraft 2>&1); then
            [[ "$draft" == *"release not found"* ]] || { echo "$draft" >&2; exit 1; }
            draft=none
          fi
          if [[ "$draft" == true ]]; then
            gh release delete "$RC_TAG" --yes
            draft=none
          fi
          if [[ "$draft" == none ]]; then
            gh release create "$RC_TAG" dist/* --prerelease --target "$GITHUB_SHA" \
              --title "$RC_TAG" --notes-file notes.md
          else
            gh release upload "$RC_TAG" dist/* --clobber
          fi

  approve:
    name: approve release
    needs: [version, candidate]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - env:
          RC_TAG: ${{ needs.version.outputs.rc_tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: echo "Promoting $RC_TAG to v$VERSION"

  build-final:
    name: build release
    needs: [version, approve]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}
      artifact-name: final

  release:
    name: publish release
    needs: [version, build-final]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Only git-cliff: XcodeGen in mise.toml is macOS-only.
      - uses: jdx/mise-action@v4
        with:
          install_args: git-cliff
      - uses: actions/download-artifact@v8
        with:
          name: final
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          scripts/release/notes.sh full > notes.md
          # See the candidate step: a killed publish leaves a tagless draft,
          # which must not be published as it is, since that would tag an old
          # commit. A draft has no tag, so deleting it needs no --cleanup-tag.
          # "release not found" means missing; any other failure fails the step.
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1); then
            [[ "$draft" == *"release not found"* ]] || { echo "$draft" >&2; exit 1; }
            draft=none
          fi
          if [[ "$draft" == true ]]; then
            gh release delete "$TAG" --yes
            draft=none
          fi
          if [[ "$draft" == none ]]; then
            gh release create "$TAG" dist/* --latest --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file notes.md
          else
            # A re-run after a failure after the release was published.
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --prerelease=false --latest --notes-file notes.md
          fi
