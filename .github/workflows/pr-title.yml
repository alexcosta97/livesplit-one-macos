name: PR title

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            style
            chore
          # Squash merges make the title the commit on main, so it gets the
          # check commitlint's subject-case rule makes on commits: the
          # description doesn't start with a capital letter.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >-
            The description "{subject}" in "{title}" must not start with an
            upper-case letter.
