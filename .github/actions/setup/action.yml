# Selects the Xcode the project builds with (.github/actions/select-xcode),
# installs the Rust toolchain from rust-toolchain.toml and the tools pinned in
# mise.toml, and restores the Rust cache. Jobs that build the same way share
# a cache key, so one job compiles the dependencies and the others reuse them.
name: Setup
description: Select Xcode, install Rust and the mise tools, and restore the Rust cache

inputs:
  cache-key:
    description: >-
      Which Rust cache to use. Debug builds use `ci`; Release universal builds
      use `release`. Each kind of build gets its own key so that saving one
      never overwrites the other's cache.
    required: false
    default: 'ci'
  save-cache:
    description: Whether to save the Rust cache at the end of the job
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: ./.github/actions/select-xcode
    # rustup is preinstalled on GitHub's macOS runners. With no arguments it
    # installs the toolchain, components and targets rust-toolchain.toml names.
    - name: Install the Rust toolchain
      shell: bash
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: core
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache }}
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
